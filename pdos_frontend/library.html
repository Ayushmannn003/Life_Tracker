<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Library</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-dark: #070414;
            --bg-card: #141125;
            --bg-card-inner: #1e1936;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent-green: #69f0ae;
            --accent-blue: #3b82f6;
            --accent-purple: #a855f7;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
            --border-dim: #2a2444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-container {
            width: 100%;
            max-width: 430px; /* Locked to strict mobile dimensions */
            padding: 20px 20px 100px 20px;
            overflow-x: hidden;
            position: relative;
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* --- Header --- */
        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .icon-btn:hover { color: var(--text-main); }

        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- Global Form Inputs --- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
        }

        .custom-input {
            background: var(--bg-card-inner);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 14px 15px;
            border-radius: 14px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .custom-input:focus { border-color: var(--accent-blue); }

        .btn-add {
            background: var(--accent-blue);
            color: var(--bg-dark);
            border: none;
            border-radius: 14px;
            padding: 14px 0;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            width: 100%;
            margin-top: 5px;
        }

        .btn-add:active { transform: scale(0.95); }
        .btn-add:hover { filter: brightness(1.1); }

        /* --- Filter Navigation --- */
        .filter-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }
        
        .filter-nav::-webkit-scrollbar { display: none; }

        .filter-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-pill.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: var(--bg-dark);
        }

        /* --- Visual Archive Grid --- */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .archive-card {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-dim);
            border-radius: 18px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            min-height: 140px;
        }

        .archive-card:active { transform: scale(0.97); }

        /* Type specific top borders */
        .type-book { border-top: 4px solid var(--accent-blue); }
        .type-article { border-top: 4px solid var(--accent-yellow); }
        .type-video { border-top: 4px solid var(--accent-purple); }

        .archive-icon {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        .type-book .archive-icon { color: var(--accent-blue); }
        .type-article .archive-icon { color: var(--accent-yellow); }
        .type-video .archive-icon { color: var(--accent-purple); }

        .archive-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .archive-source {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .status-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-dim);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .archive-card.completed .status-btn {
            background: var(--accent-green-dim);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .delete-btn:hover { color: var(--accent-red); }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 30px 0;
            font-style: italic;
            border: 1px dashed var(--border-dim);
            border-radius: 18px;
        }

        /* --- Shared Bottom Nav & App Drawer --- */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 60px); max-width: 380px; background: #0d0920; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 30px; display: flex; justify-content: space-around; align-items: center; padding: 5px 10px; z-index: 100; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 30%; padding: 8px 0; color: #6b7280; text-decoration: none; font-size: 0.65rem; font-weight: 600; border-radius: 20px; transition: all 0.3s ease; cursor: pointer; }
        .nav-item i { font-size: 1.1rem; }
        .nav-item:hover:not(.active) { color: #a78bfa; }
        .nav-item.active { background: #6DF2B5; color: #070414; box-shadow: 0 0 15px rgba(109, 242, 181, 0.2); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .bottom-sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 430px; /* Matched strict mobile dimensions */ max-height: 85vh; background: var(--bg-card); border-top: 1px solid var(--border-dim); border-radius: 32px 32px 0 0; padding: 20px 20px 0 20px; z-index: 1000; transition: transform 0.35s cubic-bezier(0.33, 1, 0.68, 1); display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); }
        .bottom-sheet.active { transform: translateX(-50%) translateY(0); }
        .drag-handle { width: 40px; height: 5px; background: var(--border-dim); border-radius: 5px; margin: 0 auto 20px auto; }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-title { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .close-btn { background: var(--bg-card-inner); border: 1px solid var(--border-dim); border-radius: 50%; width: 32px; height: 32px; color: var(--text-muted); cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s; }
        .close-btn:hover { color: var(--text-main); background: #2a2444; }
        .sheet-content { overflow-y: auto; padding-bottom: 40px; -ms-overflow-style: none; scrollbar-width: none; }
        .sheet-content::-webkit-scrollbar { display: none; }
        .section-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin: 15px 0 15px 5px; }
        
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; margin-bottom: 25px; }
        .app-icon-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; transition: transform 0.1s; }
        .app-icon-btn:active { transform: scale(0.92); }
        .app-icon-circle { width: 56px; height: 56px; background: var(--bg-card-inner); border: 1px solid var(--border-dim); border-radius: 18px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; transition: border-color 0.3s; }
        .app-icon-btn:hover .app-icon-circle { border-color: rgba(255,255,255,0.2); }
        .app-icon-label { font-size: 0.65rem; font-weight: 600; text-align: center; color: var(--text-muted); }

    </style>
</head>
<body>

<div class="app-container">
    
    <header>
        <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button>
        <h1>Knowledge Library</h1>
    </header>

    <div class="section-title"><i class="fa-solid fa-layer-group" style="color: var(--accent-blue);"></i> Input Terminal</div>
    <div class="card">
        <div class="form-group">
            <input type="text" id="mat-title" class="custom-input" placeholder="Title (e.g. Atomic Habits, React JS Crash Course)">
            <div class="form-row-2">
                <input type="text" id="mat-source" class="custom-input" placeholder="Author / Channel">
                <select id="mat-type" class="custom-input" style="color: var(--text-muted);">
                    <option value="book">Book</option>
                    <option value="article">Article</option>
                    <option value="video">Video</option>
                </select>
            </div>
            <button class="btn-add" onclick="addMaterial()"><i class="fa-solid fa-plus"></i> Add to Archive</button>
        </div>
    </div>

    <div class="filter-nav" id="filter-nav">
        <div class="filter-pill active" onclick="setFilter('all')">ALL</div>
        <div class="filter-pill" onclick="setFilter('book')">BOOKS</div>
        <div class="filter-pill" onclick="setFilter('article')">ARTICLES</div>
        <div class="filter-pill" onclick="setFilter('video')">VIDEOS</div>
    </div>

    <div class="archive-grid" id="archive-grid">
        </div>

</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item">
        <i class="fa-solid fa-grip"></i>
        <span>Dashboard</span>
    </a>
    <div class="nav-item active" onclick="toggleActivityModal()">
        <i class="fa-regular fa-rectangle-list"></i>
        <span>Activity</span>
    </div>
    <a href="analyzer.html" class="nav-item">
        <i class="fa-solid fa-chart-column"></i>
        <span>Analytics</span>
    </a>
</div>

<div class="modal-overlay" id="activity-overlay" onclick="toggleActivityModal()"></div>
<div class="bottom-sheet" id="activity-sheet">
    <div class="drag-handle"></div>
    <div class="sheet-header">
        <h2 class="sheet-title">System Modules</h2>
        <button class="close-btn" onclick="toggleActivityModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="sheet-content">
        <div class="section-label">PROTOCOLS</div>
        <div class="app-grid">
            <a href="todo.html" class="app-icon-btn"><div class="app-icon-circle" style="color: #06b6d4;"><i class="fa-solid fa-square-check"></i></div><span class="app-icon-label">Tasks</span></a>
            <a href="rituals.html" class="app-icon-btn"><div class="app-icon-circle" style="color: #eab308;"><i class="fa-regular fa-sun"></i></div><span class="app-icon-label">Rituals</span></a>
            <a href="habits.html" class="app-icon-btn"><div class="app-icon-circle" style="color: #06b6d4;"><i class="fa-regular fa-calendar-check"></i></div><span class="app-icon-label">Habits</span></a>
        </div>
        <div class="section-label">TIME & MACRO</div>
        <div class="app-grid">
            <a href="schedule.html" class="app-icon-btn"><div class="app-icon-circle" style="color: #ffffff;"><i class="fa-regular fa-calendar"></i></div><span class="app-icon-label">Schedule</span></a>
            <a href="weekly.html" class="app-icon-btn"><div class="app-icon-circle" style="color: #3b82f6;"><i class="fa-solid fa-border-all"></i></div><span class="app-icon-label">Matrix</span></a>
        </div>
        <div class="section-label">BIO & WEALTH</div>
        <div class="app-grid">
            <a href="health.html" class="app-icon-btn"><div class="app-icon-circle" style="color: #ef4444;"><i class="fa-solid fa-heart-pulse"></i></div><span class="app-icon-label">Health</span></a>
            <a href="sleep.html" class="app-icon-btn"><div class="app-icon-circle" style="color: #a855f7;"><i class="fa-solid fa-moon"></i></div><span class="app-icon-label">Sleep</span></a>
            <a href="budget.html" class="app-icon-btn"><div class="app-icon-circle" style="color: #ef4444;"><i class="fa-solid fa-wallet"></i></div><span class="app-icon-label">Finance</span></a>
            <a href="diet.html" class="app-icon-btn"><div class="app-icon-circle" style="color: var(--accent-green);"><i class="fa-solid fa-apple-whole"></i></div><span class="app-icon-label">Diet</span></a>
        </div>
        <div class="section-label">DATA & KNOWLEDGE</div>
        <div class="app-grid">
            <a href="academics.html" class="app-icon-btn"><div class="app-icon-circle" style="color: #a855f7;"><i class="fa-solid fa-graduation-cap"></i></div><span class="app-icon-label">Academics</span></a>
            <a href="library.html" class="app-icon-btn"><div class="app-icon-circle" style="color: #3b82f6;"><i class="fa-solid fa-book"></i></div><span class="app-icon-label">Library</span></a>
            <a href="analyzer.html" class="app-icon-btn"><div class="app-icon-circle" style="color: var(--accent-green);"><i class="fa-solid fa-chart-line"></i></div><span class="app-icon-label">Analytics</span></a>
        </div>
    </div>
</div>

<script>
    // --- Data Management System ---
    let libraryData = JSON.parse(localStorage.getItem('system_os_library_v2')) || [];
    let currentFilter = 'all';

    // Change select color on interaction
    document.getElementById('mat-type').addEventListener('change', function() {
        this.style.color = 'var(--text-main)';
    });

    // Icons mapping
    const typeIcons = {
        'book': 'fa-book',
        'article': 'fa-file-lines',
        'video': 'fa-circle-play'
    };

    function addMaterial() {
        const title = document.getElementById('mat-title').value.trim();
        const source = document.getElementById('mat-source').value.trim() || 'Unknown';
        const type = document.getElementById('mat-type').value;

        if (!title) {
            alert("Please enter a title.");
            return;
        }

        libraryData.push({
            id: Date.now().toString(),
            title: title,
            source: source,
            type: type,
            status: 'active', // 'active' or 'completed'
            addedOn: new Date().toISOString()
        });

        localStorage.setItem('system_os_library_v2', JSON.stringify(libraryData));

        // Reset fields
        document.getElementById('mat-title').value = '';
        document.getElementById('mat-source').value = '';
        
        renderGrid();
    }

    function deleteMaterial(id) {
        libraryData = libraryData.filter(m => m.id !== id);
        localStorage.setItem('system_os_library_v2', JSON.stringify(libraryData));
        renderGrid();
    }

    function toggleStatus(id) {
        const item = libraryData.find(m => m.id === id);
        if (item) {
            item.status = item.status === 'active' ? 'completed' : 'active';
            localStorage.setItem('system_os_library_v2', JSON.stringify(libraryData));
            renderGrid();
        }
    }

    function setFilter(type) {
        currentFilter = type;
        
        // Update Pills
        const pills = document.querySelectorAll('.filter-pill');
        pills.forEach(pill => {
            if(pill.textContent.toLowerCase().includes(type.substring(0, 3))) {
                pill.classList.add('active');
            } else {
                pill.classList.remove('active');
            }
        });

        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('archive-grid');
        grid.innerHTML = '';

        let filteredData = libraryData;
        if (currentFilter !== 'all') {
            filteredData = libraryData.filter(m => m.type === currentFilter);
        }

        if (filteredData.length === 0) {
            grid.innerHTML = `<div class="empty-state">No materials found in this sector.</div>`;
            return;
        }

        // Sort: Active first, Completed last, then by date added
        filteredData.sort((a, b) => {
            if (a.status === 'active' && b.status === 'completed') return -1;
            if (a.status === 'completed' && b.status === 'active') return 1;
            return new Date(b.addedOn) - new Date(a.addedOn);
        });

        filteredData.forEach(mat => {
            const isCompleted = mat.status === 'completed';
            
            grid.innerHTML += `
                <div class="archive-card type-${mat.type} ${isCompleted ? 'completed' : ''}">
                    <div>
                        <div class="archive-icon">
                            <i class="fa-solid ${typeIcons[mat.type]}"></i>
                        </div>
                        <div class="archive-title">${mat.title}</div>
                        <div class="archive-source">${mat.source}</div>
                    </div>
                    
                    <div class="card-bottom">
                        <button class="status-btn" onclick="toggleStatus('${mat.id}')">
                            ${isCompleted ? '<i class="fa-solid fa-check"></i> DONE' : 'ACTIVE'}
                        </button>
                        <button class="delete-btn" onclick="deleteMaterial('${mat.id}')">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            `;
        });
    }

    // --- App Drawer Modal ---
    function toggleActivityModal() {
        const overlay = document.getElementById('activity-overlay');
        const sheet = document.getElementById('activity-sheet');
        overlay.classList.toggle('active');
        sheet.classList.toggle('active');
        document.body.style.overflow = sheet.classList.contains('active') ? 'hidden' : '';
    }

    // Init
    document.addEventListener('DOMContentLoaded', renderGrid);

</script>
</body>
</html>
