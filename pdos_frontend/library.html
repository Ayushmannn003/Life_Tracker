<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-dark: #070414;
            --bg-card: #141125;
            --bg-card-inner: #1e1936;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent-green: #69f0ae;
            --accent-green-dim: rgba(105, 240, 174, 0.15);
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --border-dim: #2a2444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px 20px 100px 20px;
            overflow-x: hidden;
            position: relative;
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* --- Header --- */
        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .icon-btn:hover { color: var(--text-main); }

        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- UI Cards --- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- Stats Row --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-cell {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-dim);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 4px;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .stat-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* --- Form Inputs --- */
        .custom-input {
            background: var(--bg-card-inner);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            margin-bottom: 12px;
        }

        .custom-input:focus { border-color: var(--accent-blue); }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 5px;
        }

        .btn-add {
            background: var(--accent-blue);
            color: var(--text-main);
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, filter 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-add:active { transform: scale(0.95); }
        .btn-add:hover { filter: brightness(1.1); }

        /* --- Visual Bookshelf Grid --- */
        .library-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .book-card {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-dim);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Generated Cover Art Gradients */
        .book-cover {
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.4);
            position: relative;
        }
        
        .cover-book { background: linear-gradient(135deg, #6b21a8, #a855f7); }
        .cover-article { background: linear-gradient(135deg, #1e3a8a, #3b82f6); }
        .cover-video { background: linear-gradient(135deg, #9a3412, #f59e0b); }

        .book-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .b-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .b-author {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .status-queued { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }
        .status-reading { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
        .status-completed { background: var(--accent-green-dim); color: var(--accent-green); }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            font-size: 0.9rem;
        }
        
        .delete-btn:hover { color: var(--accent-red); }

        .empty-state { grid-column: 1 / -1; text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 20px 0; font-style: italic; }

        /* --- Shared Bottom Nav & App Drawer --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 60px); 
            max-width: 380px;
            background: #0d0920; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px; 
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px 10px; 
            z-index: 100;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); 
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 30%; 
            padding: 8px 0; 
            color: #6b7280; 
            text-decoration: none;
            font-size: 0.65rem; 
            font-weight: 600;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item i { font-size: 1.1rem; }
        .nav-item:hover:not(.active) { color: #a78bfa; }
        .nav-item.active { background: #6DF2B5; color: #070414; box-shadow: 0 0 15px rgba(109, 242, 181, 0.2); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .bottom-sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 480px; max-height: 85vh; background: var(--bg-card); border-top: 1px solid var(--border-dim); border-radius: 32px 32px 0 0; padding: 20px 20px 0 20px; z-index: 1000; transition: transform 0.35s cubic-bezier(0.33, 1, 0.68, 1); display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); }
        .bottom-sheet.active { transform: translateX(-50%) translateY(0); }
        .drag-handle { width: 40px; height: 5px; background: var(--border-dim); border-radius: 5px; margin: 0 auto 20px auto; }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-title { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .close-btn { background: var(--bg-card-inner); border: 1px solid var(--border-dim); border-radius: 50%; width: 32px; height: 32px; color: var(--text-muted); cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s; }
        .close-btn:hover { color: var(--text-main); background: #2a2444; }
        .sheet-content { overflow-y: auto; padding-bottom: 40px; -ms-overflow-style: none; scrollbar-width: none; }
        .sheet-content::-webkit-scrollbar { display: none; }
        .section-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin: 15px 0 15px 5px; }
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; margin-bottom: 25px; }
        .app-icon-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; transition: transform 0.1s; }
        .app-icon-btn:active { transform: scale(0.92); }
        .app-icon-circle { width: 56px; height: 56px; background: var(--bg-card-inner); border: 1px solid var(--border-dim); border-radius: 18px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; transition: border-color 0.3s; }
        .app-icon-btn:hover .app-icon-circle { border-color: rgba(255,255,255,0.2); }
        .app-icon-label { font-size: 0.65rem; font-weight: 600; text-align: center; color: var(--text-muted); }

    </style>
</head>
<body>

<div class="app-container">
    
    <header>
        <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button>
        <h1>Library</h1>
    </header>

    <div class="stats-grid">
        <div class="stat-cell">
            <span class="stat-val" id="stat-total" style="color: var(--accent-blue);">0</span>
            <span class="stat-label">Total Logs</span>
        </div>
        <div class="stat-cell">
            <span class="stat-val" id="stat-reading" style="color: var(--accent-purple);">0</span>
            <span class="stat-label">In Progress</span>
        </div>
        <div class="stat-cell">
            <span class="stat-val" id="stat-completed" style="color: var(--accent-green);">0</span>
            <span class="stat-label">Completed</span>
        </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-bookmark" style="color: var(--accent-blue);"></i> Add Resource</div>
    <div class="card" style="margin-bottom: 20px;">
        <input type="text" id="lib-title" class="custom-input" placeholder="Title (e.g., Deep Work)">
        <input type="text" id="lib-author" class="custom-input" placeholder="Author / Source">
        
        <div class="form-row">
            <select id="lib-type" class="custom-input" style="color: var(--text-muted); margin-bottom: 0;">
                <option value="book">📘 Book</option>
                <option value="article">📄 Article / Paper</option>
                <option value="video">📺 Video / Course</option>
            </select>
            <select id="lib-status" class="custom-input" style="color: var(--text-muted); margin-bottom: 0;">
                <option value="queued">Queued</option>
                <option value="reading">In Progress</option>
                <option value="completed">Completed</option>
            </select>
        </div>
        <button class="btn-add" onclick="addResource()"><i class="fa-solid fa-plus"></i> Store in Library</button>
    </div>

    <div class="section-title"><i class="fa-solid fa-layer-group" style="color: var(--text-main);"></i> The Archives</div>
    <div class="library-grid" id="library-grid">
        </div>

</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item">
        <i class="fa-solid fa-grip"></i>
        <span>Dashboard</span>
    </a>
    <div class="nav-item active" onclick="toggleActivityModal()">
        <i class="fa-regular fa-rectangle-list"></i>
        <span>Activity</span>
    </div>
    <a href="analyzer.html" class="nav-item">
        <i class="fa-solid fa-chart-column"></i>
        <span>Analytics</span>
    </a>
</div>

<div class="modal-overlay" id="activity-overlay" onclick="toggleActivityModal()"></div>
<div class="bottom-sheet" id="activity-sheet">
    <div class="drag-handle"></div>
    <div class="sheet-header">
        <h2 class="sheet-title">System Modules</h2>
        <button class="close-btn" onclick="toggleActivityModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>

        <div class="sheet-content">
            <div class="section-label">PROTOCOLS</div>
            <div class="app-grid">
                <a href="todo.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #06b6d4;"><i class="fa-solid fa-square-check"></i></div>
                    <span class="app-icon-label">Tasks</span>
                </a>
                <a href="rituals.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #eab308;"><i class="fa-regular fa-sun"></i></div>
                    <span class="app-icon-label">Rituals</span>
                </a>
                <a href="habits.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #06b6d4;"><i class="fa-regular fa-calendar-check"></i>
                    </div>
                    <span class="app-icon-label">Habits</span>
                </a>
            </div>

            <div class="section-label">TIME & MACRO</div>
            <div class="app-grid">
                <a href="schedule.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #ffffff;"><i class="fa-regular fa-calendar"></i></div>
                    <span class="app-icon-label">Schedule</span>
                </a>
                <a href="weekly.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #3b82f6;"><i class="fa-solid fa-border-all"></i></div>
                    <span class="app-icon-label">Matrix</span>
                </a>
            </div>

            <div class="section-label">BIO & WEALTH</div>
            <div class="app-grid">
                <a href="health.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #ef4444;"><i class="fa-solid fa-heart-pulse"></i></div>
                    <span class="app-icon-label">Health</span>
                </a>
                <a href="sleep.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #a855f7;"><i class="fa-solid fa-moon"></i></div>
                    <span class="app-icon-label">Sleep</span>
                </a>
                <a href="budget.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #ef4444;"><i class="fa-solid fa-wallet"></i></div>
                    <span class="app-icon-label">Finance</span>
                </a>
                <a href="diet.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: var(--accent-green);"><i
                            class="fa-solid fa-apple-whole"></i></div>
                    <span class="app-icon-label">Diet</span>
                </a>
            </div>

            <div class="section-label">DATA & KNOWLEDGE</div>
            <div class="app-grid">
                <a href="academics.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #a855f7;"><i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span class="app-icon-label">Academics</span>
                </a>
                <a href="library.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #3b82f6;"><i class="fa-solid fa-book"></i></div>
                    <span class="app-icon-label">Library</span>
                </a>
                <a href="analyzer.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: var(--accent-green);"><i
                            class="fa-solid fa-chart-line"></i></div>
                    <span class="app-icon-label">Analytics</span>
                </a>
            </div>
        </div>
    </div>
<script>
    // --- State Management ---
    let library = JSON.parse(localStorage.getItem('system_os_library')) || [];

    // Select color fixes
    ['lib-type', 'lib-status'].forEach(id => {
        document.getElementById(id).addEventListener('change', function() {
            this.style.color = 'var(--text-main)';
        });
    });

    const statusLabels = {
        'queued': 'Queue',
        'reading': 'In Progress',
        'completed': 'Completed'
    };

    const typeIcons = {
        'book': 'fa-book',
        'article': 'fa-file-lines',
        'video': 'fa-circle-play'
    };

    // --- Library Logic ---
    function addResource() {
        const title = document.getElementById('lib-title').value.trim();
        const author = document.getElementById('lib-author').value.trim();
        const type = document.getElementById('lib-type').value;
        const status = document.getElementById('lib-status').value;

        if (!title) return;

        library.push({
            id: Date.now().toString(),
            title,
            author: author || "Unknown",
            type,
            status,
            createdAt: new Date().toISOString()
        });

        localStorage.setItem('system_os_library', JSON.stringify(library));
        
        document.getElementById('lib-title').value = '';
        document.getElementById('lib-author').value = '';
        renderLibrary();
    }

    function deleteResource(id) {
        library = library.filter(r => r.id !== id);
        localStorage.setItem('system_os_library', JSON.stringify(library));
        renderLibrary();
    }

    // Tap status pill to cycle states
    window.cycleStatus = function(id) {
        const res = library.find(r => r.id === id);
        if (res) {
            if (res.status === 'queued') res.status = 'reading';
            else if (res.status === 'reading') res.status = 'completed';
            else res.status = 'queued';
            
            localStorage.setItem('system_os_library', JSON.stringify(library));
            renderLibrary();
        }
    }

    function renderLibrary() {
        const grid = document.getElementById('library-grid');
        grid.innerHTML = '';

        // Stats Calculation
        let total = library.length;
        let reading = library.filter(r => r.status === 'reading').length;
        let completed = library.filter(r => r.status === 'completed').length;

        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-reading').textContent = reading;
        document.getElementById('stat-completed').textContent = completed;

        if (total === 0) {
            grid.innerHTML = `<div class="empty-state">Knowledge base is currently empty.</div>`;
            return;
        }

        // Sort: Reading first, then Queued, then Completed
        library.sort((a, b) => {
            const priority = { 'reading': 1, 'queued': 2, 'completed': 3 };
            return priority[a.status] - priority[b.status];
        });

        library.forEach(item => {
            const coverClass = `cover-${item.type}`;
            const iconClass = typeIcons[item.type];
            
            grid.innerHTML += `
                <div class="book-card">
                    <div class="book-cover ${coverClass}">
                        <i class="fa-solid ${iconClass}"></i>
                    </div>
                    <div class="book-info">
                        <div class="b-title" title="${item.title}">${item.title}</div>
                        <div class="b-author">${item.author}</div>
                        
                        <div class="card-actions">
                            <div class="status-badge status-${item.status}" onclick="cycleStatus('${item.id}')">
                                ${statusLabels[item.status]}
                            </div>
                            <button class="delete-btn" onclick="deleteResource('${item.id}')"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // --- App Drawer Modal ---
    function toggleActivityModal() {
        const overlay = document.getElementById('activity-overlay');
        const sheet = document.getElementById('activity-sheet');
        overlay.classList.toggle('active');
        sheet.classList.toggle('active');
        document.body.style.overflow = sheet.classList.contains('active') ? 'hidden' : '';
    }

    // Init
    document.addEventListener('DOMContentLoaded', renderLibrary);

</script>
</body>
</html>
