<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-dark: #070414;
            --bg-card: #141125;
            --bg-card-inner: #1e1936;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent-green: #69f0ae;
            --accent-green-dim: rgba(105, 240, 174, 0.15);
            --border-dim: #2a2444;
            
            /* Priority Colors tuned for Dark Theme */
            --priority-high: #f87171; /* Soft Red */
            --priority-med: #fbbf24;  /* Soft Yellow */
            --priority-low: #38bdf8;  /* Soft Blue */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Smooth Top Transition Bar */
        .page-transition-bar {
            position: fixed;
            top: 0; left: 0;
            height: 3px;
            background: var(--accent-green);
            z-index: 9999;
            animation: loadBar 0.8s cubic-bezier(0.33, 1, 0.68, 1) forwards;
        }

        @keyframes loadBar {
            0% { width: 0%; opacity: 1; }
            80% { width: 100%; opacity: 1; }
            100% { width: 100%; opacity: 0; }
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px 20px 100px 20px; /* Space for bottom nav */
            overflow-x: hidden;
            position: relative;
            /* Animation moved here so it doesn't break the fixed nav bar */
            animation: fadeIn 0.4s ease-out forwards; 
        }

        /* --- Header --- */
        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-top: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .icon-btn:hover { color: var(--text-main); }

        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* --- Calendar Block --- */
        .calendar-card {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .month-year {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .cal-nav-btn {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-dim);
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .cal-nav-btn:hover {
            color: var(--text-main);
            border-color: var(--accent-green);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .day-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .date-cell {
            padding: 10px 0;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
            color: var(--text-muted);
        }

        .date-cell:hover {
            background: var(--bg-card-inner);
            color: var(--text-main);
        }

        .date-cell.today {
            color: var(--accent-green);
            font-weight: 800;
        }

        .date-cell.selected {
            background: var(--accent-green-dim);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }
        
        .has-task-dot {
            width: 5px;
            height: 5px;
            background-color: var(--accent-green);
            border-radius: 50%;
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* --- Command Center Form --- */
        .input-card {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .input-header {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .custom-input {
            background: var(--bg-card-inner);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 15px;
            border-radius: 16px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .custom-input:focus {
            border-color: var(--accent-green);
        }

        .btn-add {
            background: var(--accent-green);
            color: var(--bg-dark);
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: filter 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            width: 100%;
        }

        .btn-add:hover { filter: brightness(1.1); }

        /* --- Timeline List --- */
        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-left: 5px;
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-card {
            background: var(--bg-card-inner);
            border-radius: 16px;
            padding: 18px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }

        .accent-bar {
            position: absolute;
            left: 0; top: 15px; bottom: 15px;
            width: 4px;
            border-radius: 0 4px 4px 0;
        }

        .priority-high { background: var(--priority-high); }
        .priority-med { background: var(--priority-med); }
        .priority-low { background: var(--priority-low); }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 10px;
        }
        
        .task-title {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .task-time {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            transition: color 0.2s;
            font-size: 1.1rem;
        }

        .delete-btn:hover { color: #ef4444; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 20px 0;
            font-style: italic;
        }

        /* --- Smaller Bottom Navigation (Synced w/ Index) --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 60px); 
            max-width: 380px;
            background: #0d0920; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px; 
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px 10px; 
            z-index: 100;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); 
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 30%; 
            padding: 8px 0; 
            color: #6b7280; 
            text-decoration: none;
            font-size: 0.65rem; 
            font-weight: 600;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item i { font-size: 1.1rem; }
        .nav-item:hover:not(.active) { color: #a78bfa; }

        .nav-item.active {
            background: var(--accent-green); 
            color: var(--bg-dark); 
            box-shadow: 0 0 15px rgba(105, 240, 174, 0.2); 
        }

        /* --- App Drawer Modal (Bottom Sheet) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .bottom-sheet {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            background: var(--bg-card);
            border-top: 1px solid var(--border-dim);
            border-radius: 32px 32px 0 0;
            padding: 20px 20px 0 20px;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }

        .bottom-sheet.active { transform: translateX(-50%) translateY(0); }

        .drag-handle {
            width: 40px;
            height: 5px;
            background: var(--border-dim);
            border-radius: 5px;
            margin: 0 auto 20px auto;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .sheet-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .close-btn {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-dim);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        
        .close-btn:hover { color: var(--text-main); background: #2a2444; }

        .sheet-content {
            overflow-y: auto;
            padding-bottom: 40px; 
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .sheet-content::-webkit-scrollbar { display: none; }

        .section-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 15px 0 15px 5px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 10px;
            margin-bottom: 25px;
        }

        .app-icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.33, 1, 0.68, 1);
        }

        .app-icon-btn:active { transform: scale(0.9); }

        .app-icon-circle {
            width: 56px;
            height: 56px;
            background: var(--bg-card-inner);
            border: 1px solid var(--border-dim);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: border-color 0.3s;
        }

        .app-icon-btn:hover .app-icon-circle { border-color: rgba(255,255,255,0.2); }
        .app-icon-label { font-size: 0.65rem; font-weight: 600; text-align: center; color: var(--text-muted); line-height: 1.2; }

    </style>
</head>
<body>

<div class="page-transition-bar"></div>

<div class="app-container">
    
    <header>
        <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button>
        <h1>Schedule Hub</h1>
    </header>

    <div class="calendar-card">

        <div class="days-grid">

            <div class="day-label">WED</div><div class="day-label">THU</div><div class="day-label">FRI</div><div class="day-label">SAT</div>
        </div>

            </div>

                <select id="task-priority" class="custom-input" style="color: var(--text-muted);">

    <div class="section-title">Timeline</div>

</div>

<div class="bottom-nav">

        <i class="fa-solid fa-grip"></i>

    </a>

    </div>
    <a href="analyzer.html" class="nav-item">
        <i class="fa-solid fa-chart-column"></i>
        <span>Analytics</span>
    </a>
</div>

<div class="bottom-sheet" id="activity-sheet">
    <div class="drag-handle"></div>
    <div class="sheet-header">
        <h2 class="sheet-title">System Modules</h2>
        <button class="close-btn" onclick="toggleActivityModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>

        <div class="sheet-content">
            <div class="section-label">PROTOCOLS</div>
            <div class="app-grid">
                <a href="todo.html" class="app-icon-btn">

            <div class="app-grid">
                <a href="schedule.html" class="app-icon-btn">

                    <span class="app-icon-label">Schedule</span>
                </a>
                <a href="weekly.html" class="app-icon-btn">

            <div class="section-label">BIO & WEALTH</div>
            <div class="app-grid">

                </a>
                <a href="sleep.html" class="app-icon-btn">

                    <span class="app-icon-label">Sleep</span>
                </a>
                <a href="budget.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #ef4444;"><i class="fa-solid fa-wallet"></i></div>
                    <span class="app-icon-label">Finance</span>

                </a>
            </div>

            <div class="section-label">DATA & KNOWLEDGE</div>
            <div class="app-grid">
                <a href="academics.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #a855f7;"><i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span class="app-icon-label">Academics</span>
                </a>

                </a>

                    <div class="app-icon-circle" style="color: var(--accent-green);"><i
                            class="fa-solid fa-chart-line"></i></div>

<script>
    // --- State Variables ---
    let currentDate = new Date(); 
    let selectedDateStr = formatDate(new Date()); 
    let scheduleData = JSON.parse(localStorage.getItem('system_os_schedule')) || [];

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    // --- Utility: Format Date string to YYYY-MM-DD ---
    function formatDate(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    // --- Utility: Convert 24hr to 12hr ---
    function formatTimeDisplay(timeStr) {
        if(!timeStr) return "All Day";
        let [hours, minutes] = timeStr.split(':');
        hours = parseInt(hours);
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; 
        return `${hours}:${minutes} ${ampm}`;
    }

    // --- Calendar Logic ---
    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        document.getElementById('month-display').textContent = `${monthNames[month]} ${year}`;
        
        const firstDay = new Date(year, month, 1).getDay(); 
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';

        const todayStr = formatDate(new Date());

        // Empty slots before the 1st
        for (let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement('div');
            grid.appendChild(emptyCell);
        }

        // Fill days
        for (let day = 1; day <= daysInMonth; day++) {
            const dateCellObj = new Date(year, month, day);
            const dateStr = formatDate(dateCellObj);
            
            const cell = document.createElement('div');
            cell.className = 'date-cell';
            cell.textContent = day;
            
            if (dateStr === todayStr) cell.classList.add('today');
            if (dateStr === selectedDateStr) cell.classList.add('selected');

            // Dot Indicator
            const hasTasks = scheduleData.some(task => task.date === dateStr);
            if (hasTasks) {
                const dot = document.createElement('div');
                dot.className = 'has-task-dot';
                cell.appendChild(dot);
            }

            cell.onclick = () => {
                selectedDateStr = dateStr;
                renderCalendar(); 
                renderTasks();
            };

            grid.appendChild(cell);
        }

        document.getElementById('selected-date-label').textContent = selectedDateStr;
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    // --- Data Management Logic ---
    function addScheduleTask() {
        const titleInput = document.getElementById('task-title');
        const timeInput = document.getElementById('task-time');
        const priorityInput = document.getElementById('task-priority');

        if (!titleInput.value.trim()) {
            alert("Please enter an activity title.");
            return;
        }

        const newTask = {
            id: Date.now().toString(),
            date: selectedDateStr,
            time: timeInput.value || "00:00",
            title: titleInput.value.trim(),
            priority: priorityInput.value
        };

        scheduleData.push(newTask);
        localStorage.setItem('system_os_schedule', JSON.stringify(scheduleData));
        
        // Reset Inputs
        titleInput.value = '';
        timeInput.value = '';
        
        renderCalendar(); 
        renderTasks();
    }

    function deleteTask(id) {
        scheduleData = scheduleData.filter(t => t.id !== id);
        localStorage.setItem('system_os_schedule', JSON.stringify(scheduleData));
        renderCalendar(); 
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('schedule-list');
        list.innerHTML = '';

        let dayTasks = scheduleData.filter(t => t.date === selectedDateStr);
        dayTasks.sort((a, b) => a.time.localeCompare(b.time));

        if (dayTasks.length === 0) {
            list.innerHTML = `<div class="empty-state">No activities logged for ${selectedDateStr}.</div>`;
            return;
        }

        dayTasks.forEach(task => {
            const li = document.createElement('li');
            li.className = `task-card`;

            const displayTime = task.time === "00:00" ? "All Day" : formatTimeDisplay(task.time);

            li.innerHTML = `
                <div class="accent-bar priority-${task.priority}"></div>
                <div class="task-info">
                    <span class="task-title">${task.title}</span>
                    <span class="task-time"><i class="fa-regular fa-clock"></i> ${displayTime}</span>
                </div>
                <button class="delete-btn" onclick="deleteTask('${task.id}')">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;
            list.appendChild(li);
        });
    }

    // --- App Drawer Modal Logic ---
    function toggleActivityModal() {
        const overlay = document.getElementById('activity-overlay');
        const sheet = document.getElementById('activity-sheet');
        overlay.classList.toggle('active');
        sheet.classList.toggle('active');
        document.body.style.overflow = sheet.classList.contains('active') ? 'hidden' : '';
    }

    // --- Initialization ---
    renderCalendar();
    renderTasks();

    // Select input color fix
    document.getElementById('task-priority').addEventListener('change', function() {
        this.style.color = 'var(--text-main)';
    });

</script>
</body>
</html>
