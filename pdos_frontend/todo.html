<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Protocol</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-dark: #070414;
            --bg-card: #141125;
            --bg-card-inner: #1e1936;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent-green: #69f0ae;
            --border-dim: #2a2444;
            
            /* Category Colors */
            --cat-course: #a855f7; /* Purple */
            --cat-project: #3b82f6; /* Blue */
            --cat-revision: #eab308; /* Yellow */
            --cat-admin: #06b6d4; /* Cyan */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px 20px 100px 20px;
            overflow-x: hidden;
            position: relative;
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* --- Header --- */
        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .icon-btn:hover { color: var(--text-main); }

        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* --- Input Form (Command Center) --- */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .input-header {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .custom-input {
            background: var(--bg-card-inner);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .custom-input:focus {
            border-color: var(--accent-green);
        }

        .btn-add {
            background: var(--accent-green);
            color: var(--bg-dark);
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: filter 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            width: 100%;
        }

        .btn-add:hover { filter: brightness(1.1); }

        /* --- Task List --- */
        .task-section-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-left: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-count-badge {
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .task-item {
            background: var(--bg-card-inner);
            border: 1px solid var(--border-dim);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            transition: opacity 0.3s, border-color 0.2s;
        }
        
        .task-item:hover { border-color: rgba(255,255,255,0.1); }

        .task-left {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            flex: 1;
            cursor: pointer;
        }

        .check-circle {
            width: 24px;
            height: 24px;
            min-width: 24px;
            border-radius: 50%;
            border: 2px solid var(--border-dim);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            margin-top: 2px;
        }

        .task-item.completed .check-circle {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: var(--bg-dark);
        }

        .task-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-text {
            font-size: 1rem;
            font-weight: 600;
            transition: color 0.2s;
            word-break: break-word;
            line-height: 1.3;
        }

        .task-item.completed .task-text {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .meta-tag {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
        }

        .task-item.completed .meta-tag { opacity: 0.5; }

        /* Dynamic Tag Colors */
        .tag-course { background: rgba(168, 85, 247, 0.15); color: var(--cat-course); }
        .tag-project { background: rgba(59, 130, 246, 0.15); color: var(--cat-project); }
        .tag-revision { background: rgba(234, 179, 8, 0.15); color: var(--cat-revision); }
        .tag-admin { background: rgba(6, 182, 212, 0.15); color: var(--cat-admin); }

        .meta-deadline { color: var(--text-main); }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
            margin-left: 10px;
        }

        .delete-btn:hover { color: var(--accent-red); }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 30px 0;
            font-style: italic;
        }

        /* --- Shared Bottom Nav & App Drawer --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 60px); 
            max-width: 380px;
            background: #0d0920; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px; 
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 5px 10px; 
            z-index: 100;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); 
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 30%; 
            padding: 8px 0; 
            color: #6b7280; 
            text-decoration: none;
            font-size: 0.65rem; 
            font-weight: 600;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item i { font-size: 1.1rem; }
        .nav-item:hover:not(.active) { color: #a78bfa; }
        .nav-item.active { background: #6DF2B5; color: #070414; box-shadow: 0 0 15px rgba(109, 242, 181, 0.2); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .bottom-sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 480px; max-height: 85vh; background: var(--bg-card); border-top: 1px solid var(--border-dim); border-radius: 32px 32px 0 0; padding: 20px 20px 0 20px; z-index: 1000; transition: transform 0.35s cubic-bezier(0.33, 1, 0.68, 1); display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); }
        .bottom-sheet.active { transform: translateX(-50%) translateY(0); }
        .drag-handle { width: 40px; height: 5px; background: var(--border-dim); border-radius: 5px; margin: 0 auto 20px auto; }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-title { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .close-btn { background: var(--bg-card-inner); border: 1px solid var(--border-dim); border-radius: 50%; width: 32px; height: 32px; color: var(--text-muted); cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s; }
        .close-btn:hover { color: var(--text-main); background: #2a2444; }
        .sheet-content { overflow-y: auto; padding-bottom: 40px; -ms-overflow-style: none; scrollbar-width: none; }
        .sheet-content::-webkit-scrollbar { display: none; }
        .section-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin: 15px 0 15px 5px; }
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; margin-bottom: 25px; }
        .app-icon-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; transition: transform 0.1s; }
        .app-icon-btn:active { transform: scale(0.92); }
        .app-icon-circle { width: 56px; height: 56px; background: var(--bg-card-inner); border: 1px solid var(--border-dim); border-radius: 18px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; transition: border-color 0.3s; }
        .app-icon-btn:hover .app-icon-circle { border-color: rgba(255,255,255,0.2); }
        .app-icon-label { font-size: 0.65rem; font-weight: 600; text-align: center; color: var(--text-muted); }

    </style>
</head>
<body>

<div class="app-container">
    
    <header>
        <button class="icon-btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button>
        <h1>Task Protocol</h1>
    </header>

    <div class="form-card">
        <div class="input-header">
            <i class="fa-solid fa-terminal text-muted"></i> DEFINE NEXT ACTION
        </div>
        <div class="form-group">
            <input type="text" id="task-text" class="custom-input" placeholder="What needs to be done?">
            
            <div class="form-row">
                <input type="date" id="task-date" class="custom-input" style="color: var(--text-muted);">
                <input type="time" id="task-time" class="custom-input" style="color: var(--text-muted);">
            </div>
            
            <select id="task-category" class="custom-input" style="color: var(--text-muted);">
                <option value="none">No Category</option>
                <option value="course">📚 Coursework / Assignment</option>
                <option value="project">💻 Project / Lab</option>
                <option value="revision">📝 Study / Revision</option>
                <option value="admin">⚙️ Life Admin / Other</option>
            </select>

            <button class="btn-add" onclick="addTask()">
                <i class="fa-solid fa-plus"></i> Append Task
            </button>
        </div>
    </div>

    <div class="task-section-title">
        <span>ACTIVE DEPLOYMENTS</span>
        <span class="task-count-badge" id="active-count">0</span>
    </div>
    <ul class="task-list" id="active-tasks">
        </ul>

    <div class="task-section-title" id="completed-header" style="display: none;">
        <span>ARCHIVED</span>
        <span class="task-count-badge" id="completed-count">0</span>
    </div>
    <ul class="task-list" id="completed-tasks">
        </ul>

</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item">
        <i class="fa-solid fa-grip"></i>
        <span>Dashboard</span>
    </a>
    <div class="nav-item active" onclick="toggleActivityModal()">
        <i class="fa-regular fa-rectangle-list"></i>
        <span>Activity</span>
    </div>
    <a href="analyzer.html" class="nav-item">
        <i class="fa-solid fa-chart-column"></i>
        <span>Analytics</span>
    </a>
</div>

<div class="modal-overlay" id="activity-overlay" onclick="toggleActivityModal()"></div>
<div class="bottom-sheet" id="activity-sheet">
    <div class="drag-handle"></div>
    <div class="sheet-header">
        <h2 class="sheet-title">System Modules</h2>
        <button class="close-btn" onclick="toggleActivityModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>

        <div class="sheet-content">
            <div class="section-label">PROTOCOLS</div>
            <div class="app-grid">
                <a href="todo.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #06b6d4;"><i class="fa-solid fa-square-check"></i></div>
                    <span class="app-icon-label">Tasks</span>
                </a>
                <a href="rituals.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #eab308;"><i class="fa-regular fa-sun"></i></div>
                    <span class="app-icon-label">Rituals</span>
                </a>
                <a href="habits.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #06b6d4;"><i class="fa-regular fa-calendar-check"></i>
                    </div>
                    <span class="app-icon-label">Habits</span>
                </a>
            </div>

            <div class="section-label">TIME & MACRO</div>
            <div class="app-grid">
                <a href="schedule.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #ffffff;"><i class="fa-regular fa-calendar"></i></div>
                    <span class="app-icon-label">Schedule</span>
                </a>
                <a href="weekly.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #3b82f6;"><i class="fa-solid fa-border-all"></i></div>
                    <span class="app-icon-label">Matrix</span>
                </a>
            </div>

            <div class="section-label">BIO & WEALTH</div>
            <div class="app-grid">
                <a href="health.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #ef4444;"><i class="fa-solid fa-heart-pulse"></i></div>
                    <span class="app-icon-label">Health</span>
                </a>
                <a href="sleep.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #a855f7;"><i class="fa-solid fa-moon"></i></div>
                    <span class="app-icon-label">Sleep</span>
                </a>
                <a href="budget.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #ef4444;"><i class="fa-solid fa-wallet"></i></div>
                    <span class="app-icon-label">Finance</span>
                </a>
                <a href="diet.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: var(--accent-green);"><i
                            class="fa-solid fa-apple-whole"></i></div>
                    <span class="app-icon-label">Diet</span>
                </a>
            </div>

            <div class="section-label">DATA & KNOWLEDGE</div>
            <div class="app-grid">
                <a href="academics.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #a855f7;"><i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span class="app-icon-label">Academics</span>
                </a>
                <a href="library.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: #3b82f6;"><i class="fa-solid fa-book"></i></div>
                    <span class="app-icon-label">Library</span>
                </a>
                <a href="analyzer.html" class="app-icon-btn">
                    <div class="app-icon-circle" style="color: var(--accent-green);"><i
                            class="fa-solid fa-chart-line"></i></div>
                    <span class="app-icon-label">Analytics</span>
                </a>
            </div>
        </div>
    </div>
<script>
    // --- Data Management ---
    let tasks = JSON.parse(localStorage.getItem('system_os_tasks')) || [];

    // Fix Input Colors on interaction
    const inputs = ['task-date', 'task-time', 'task-category'];
    inputs.forEach(id => {
        document.getElementById(id).addEventListener('change', function() {
            this.style.color = 'var(--text-main)';
        });
    });

    // Format Dates for Display
    const formatDateTime = (dateStr, timeStr) => {
        if (!dateStr && !timeStr) return null;
        
        let display = "";
        if (dateStr) {
            const d = new Date(dateStr);
            display += d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }
        
        if (timeStr) {
            let [hours, minutes] = timeStr.split(':');
            hours = parseInt(hours);
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; 
            display += (display ? " at " : "") + `${hours}:${minutes} ${ampm}`;
        }
        return display;
    };

    // Map Category to Display Info
    const getCategoryDetails = (cat) => {
        const details = {
            course: { icon: 'fa-book', text: 'Coursework', class: 'tag-course' },
            project: { icon: 'fa-laptop-code', text: 'Project', class: 'tag-project' },
            revision: { icon: 'fa-pen-nib', text: 'Revision', class: 'tag-revision' },
            admin: { icon: 'fa-gear', text: 'Admin', class: 'tag-admin' }
        };
        return details[cat] || null;
    };

    function saveTasks() {
        localStorage.setItem('system_os_tasks', JSON.stringify(tasks));
        renderTasks();
    }

    function addTask() {
        const textInput = document.getElementById('task-text');
        const dateInput = document.getElementById('task-date');
        const timeInput = document.getElementById('task-time');
        const catInput = document.getElementById('task-category');

        const text = textInput.value.trim();
        if (!text) {
            alert("Please define the task action.");
            return;
        }

        tasks.push({
            id: Date.now().toString(),
            text: text,
            date: dateInput.value || null,
            time: timeInput.value || null,
            category: catInput.value !== 'none' ? catInput.value : null,
            completed: false,
            createdAt: new Date().toISOString()
        });

        // Reset Form
        textInput.value = '';
        dateInput.value = '';
        timeInput.value = '';
        catInput.value = 'none';
        inputs.forEach(id => document.getElementById(id).style.color = 'var(--text-muted)');

        saveTasks();
    }

    function toggleTask(id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
            task.completed = !task.completed;
            saveTasks();
        }
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
    }

    function renderTasks() {
        const activeList = document.getElementById('active-tasks');
        const completedList = document.getElementById('completed-tasks');
        const completedHeader = document.getElementById('completed-header');

        activeList.innerHTML = '';
        completedList.innerHTML = '';

        let activeTasks = tasks.filter(t => !t.completed);
        let completedTasks = tasks.filter(t => t.completed);

        // Update Counters
        document.getElementById('active-count').textContent = activeTasks.length;
        document.getElementById('completed-count').textContent = completedTasks.length;

        // Sort Active Tasks Chronologically (Tasks with deadlines go to the top)
        activeTasks.sort((a, b) => {
            if (!a.date && !b.date) return 0;
            if (!a.date) return 1;
            if (!b.date) return -1;
            
            const dateA = new Date(`${a.date}T${a.time || '23:59'}`);
            const dateB = new Date(`${b.date}T${b.time || '23:59'}`);
            return dateA - dateB;
        });

        // Sort Completed Tasks by most recently added
        completedTasks.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        // Render Active
        if (activeTasks.length === 0) {
            activeList.innerHTML = `<div class="empty-state">No active tasks. System is cleared.</div>`;
        } else {
            activeTasks.forEach(task => activeList.appendChild(createTaskElement(task)));
        }

        // Render Completed
        if (completedTasks.length > 0) {
            completedHeader.style.display = 'flex';
            completedTasks.forEach(task => completedList.appendChild(createTaskElement(task)));
        } else {
            completedHeader.style.display = 'none';
        }
    }

    function createTaskElement(task) {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        
        const checkIcon = task.completed ? '<i class="fa-solid fa-check" style="font-size: 0.7rem;"></i>' : '';

        // Build Meta Tags (Date/Time & Category)
        let metaHtml = '';
        const dateTimeStr = formatDateTime(task.date, task.time);
        
        if (dateTimeStr) {
            metaHtml += `<span class="meta-tag meta-deadline"><i class="fa-regular fa-calendar"></i> ${dateTimeStr}</span>`;
        }
        
        if (task.category) {
            const cat = getCategoryDetails(task.category);
            metaHtml += `<span class="meta-tag ${cat.class}"><i class="fa-solid ${cat.icon}"></i> ${cat.text}</span>`;
        }

        const metaContainer = metaHtml ? `<div class="task-meta">${metaHtml}</div>` : '';

        li.innerHTML = `
            <div class="task-left" onclick="toggleTask('${task.id}')">
                <div class="check-circle">${checkIcon}</div>
                <div class="task-content">
                    <span class="task-text">${task.text}</span>
                    ${metaContainer}
                </div>
            </div>
            <button class="delete-btn" onclick="deleteTask('${task.id}')" title="Delete Task">
                <i class="fa-solid fa-xmark"></i>
            </button>
        `;
        return li;
    }

    // --- App Drawer Modal ---
    function toggleActivityModal() {
        const overlay = document.getElementById('activity-overlay');
        const sheet = document.getElementById('activity-sheet');
        overlay.classList.toggle('active');
        sheet.classList.toggle('active');
        document.body.style.overflow = sheet.classList.contains('active') ? 'hidden' : '';
    }

    // Run on Load
    renderTasks();
</script>

</body>
</html>
